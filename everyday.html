<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#ffffff;--ink:#0A0A0A;--dim:#9A9AA2;--line:#0A0A0A12;--card:#F2F3F5;
--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
--gap:clamp(20px,4vw,64px);--ease:cubic-bezier(.16,1,.3,1)}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:auto}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
header{position:fixed;top:14px;left:var(--gap);right:var(--gap);z-index:50;display:flex;align-items:center;justify-content:space-between;
padding:10px 16px;border-radius:40px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border:1px solid var(--line)}
header a{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;position:relative;padding-bottom:2px;color:var(--ink)}
header a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:currentColor;transition:width .4s var(--ease)}
header a:hover::after{width:100%}
.hero{padding:clamp(100px,15vh,170px) var(--gap) var(--gap);position:relative}
.blob{position:absolute;inset:0;z-index:-1;overflow:hidden}
.blob::before{content:"";position:absolute;top:6%;right:-6%;width:44vw;height:44vw;border-radius:50%;
background:radial-gradient(circle at 30% 30%,#7bdfff,transparent 60%),radial-gradient(circle at 70% 60%,#ff8ac2,transparent 60%),radial-gradient(circle at 50% 80%,#ffd27a,transparent 55%);
filter:blur(60px);opacity:.5}
.hero .tag{display:flex;justify-content:space-between;margin-bottom:clamp(24px,5vw,52px)}
.hero h1{font-weight:800;letter-spacing:-.035em;line-height:.92;font-size:clamp(44px,10vw,150px)}
.hero .mark{font-weight:400;color:var(--dim)}
.hero .facts{display:flex;flex-wrap:wrap;gap:12px;margin-top:var(--gap)}
.hero .facts div{background:var(--card);border-radius:16px;padding:14px 18px;min-width:150px}
.hero .facts h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.hero .facts p{font-size:15px;font-weight:600}
.gallery{padding:0 var(--gap) var(--gap);display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px);max-width:1100px;margin:0 auto}
.slide{position:relative;background:var(--card);border-radius:20px;overflow:hidden;opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.slide.in{opacity:1;transform:none}
.slide img{border-radius:20px}
.slide .idx{position:absolute;top:12px;left:14px;z-index:2;background:rgba(255,255,255,.85);padding:3px 8px;border-radius:20px}
.next{padding:var(--gap);display:flex;flex-direction:column;gap:24px;min-height:56svh;justify-content:center;max-width:1100px;margin:0 auto}
.next .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.next a.big{font-weight:800;letter-spacing:-.035em;line-height:.95;font-size:clamp(38px,9vw,120px);display:inline-block}
.next a.big:hover{color:var(--dim)}
.next .row{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:22px}
.next .socials{display:flex;gap:10px;flex-wrap:wrap}
.next .socials a{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--card);padding:9px 14px;border-radius:40px}
.next .socials a:hover{background:var(--ink);color:#fff}
::selection{background:var(--ink);color:#fff}
.deck{padding:0 var(--gap) clamp(12px,1.6vw,22px);max-width:1100px;margin:0 auto}
.deckwrap{position:relative;border-radius:20px;overflow:hidden;background:#000;max-width:540px;margin:0 auto;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.deckvid{width:100%;height:auto;display:block}
.ytbtn{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:8px;background:rgba(10,10,10,.82);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:10px 15px;border-radius:40px;backdrop-filter:blur(6px);transition:background .3s var(--ease)}
.ytbtn:hover{background:#FF0000}
.ytbtn .tri{font-size:9px}
@media(max-width:820px){.hero .facts div{min-width:44%}}</style>
